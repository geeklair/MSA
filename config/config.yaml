# MSA Configuration

model:
  backend: anthropic          # anthropic | vllm | ollama
  model: claude-sonnet-4-20250514
  max_tokens: 1024
  # base_url: http://localhost:8000/v1   # for vLLM
  # api_key: set via ANTHROPIC_API_KEY env var

scratchpad_path: scratchpads/active.yaml
rules_path: config/rules.md
max_iterations: 5

scheduler: slack

  #mode: interval              # interval | file_watch | slack
  # interval_seconds: 300       # 5 minutes (interval mode only)
  # slack mode: set SLACK_BOT_TOKEN (xoxb-…) and SLACK_APP_TOKEN (xapp-…)
  # Listens for DMs and @mentions via Socket Mode; no open port required.

tools:
  # Tools are all enabled by default. Disable here if needed.
  # shell: false
